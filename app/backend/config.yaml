# Centralized configuration for McDonald's AI Drive-Thru backend.
# All magic numbers previously scattered across app.py, rtmt.py, tools.py, order_state.py
# are collected here. Changes take effect on next startup (or immediately in DEV_MODE).

model:
  temperature: 0.6
  max_response_output_tokens: 4096
  api_version: "2024-10-01-preview"
  default_voice: "marin"
  # Guest-speech transcription model (session.audio.input.transcription.model).
  # `whisper-1` works on Azure with no extra deployment. gpt-4o-transcribe and
  # gpt-4o-mini-transcribe are ACCEPTED by session.update but every turn then
  # fails with DeploymentNotFound unless you deploy that model under the same
  # name on the resource (probed 2026-09-22 on the shared resource).
  # Env override: AZURE_OPENAI_REALTIME_TRANSCRIPTION_MODEL.
  transcription_model: "whisper-1"
  # reasoning.effort for reasoning realtime models (gpt-realtime-2 / 2.1):
  # none | minimal | low | medium | high | xhigh. "" (empty) omits the field.
  # Only sent when the deployment is a reasoning model (see reasoning_model):
  # gpt-realtime-1.5 rejects `reasoning` -- the whole session.update, tools
  # included. "low" was 30/30 correct with the best first-audio p90 in the
  # Sonic benchmark; none/minimal often call a tool before speaking (silent
  # guest). Env override: AZURE_OPENAI_REALTIME_REASONING_EFFORT ("off" disables).
  reasoning_effort: "low"
  # Is the deployment a reasoning model? true | false | auto. "auto" infers it
  # from the deployment name (gpt-realtime-1.5, gpt-realtime, gpt-realtime-mini,
  # gpt-4o-* => no; anything else => yes). Set it explicitly for custom names.
  # Env override: AZURE_OPENAI_REALTIME_REASONING_MODEL.
  reasoning_model: "auto"
  # parallel_tool_calls for reasoning models; null leaves the service default
  # (2.1 already batches calls; `false` serialises them and is ~1.3s slower).
  parallel_tool_calls: null

vad:
  type: "server_vad"
  threshold: 0.5
  prefix_padding_ms: 300
  silence_duration_ms: 200

business_rules:
  tax_rate: 0.08
  max_item_quantity: 10
  max_order_items: 25
  happy_hour_start: 14
  happy_hour_end: 16
  happy_hour_discount: 0.5

cache:
  search_ttl_seconds: 60.0
  search_max_size: 128

audio:
  echo_cooldown_seconds: 1.5

search:
  k_nearest_neighbors: 15
  top_results: 3

connection:
  ws_heartbeat_seconds: 15.0
  # permessage-deflate on every browser websocket (cloud /realtime, local-mode /realtime,
  # /api/ws-test). Keep false: aiohttp
  # 3.14.2/3.14.3 reject the first compressed frame after an initial PONG
  # (aio-libs/aiohttp#13274) with 1002 "non-zero reserved bits", and base64 PCM only
  # deflates ~33% for ~5x the socket CPU. Revisit once a fixed aiohttp ships.
  ws_compression: false
  ws_connect_timeout_total: 30
  ws_connect_timeout_connect: 10
  client_max_size_bytes: 4194304
  shutdown_timeout: 10.0
  keepalive_timeout: 75.0

compression:
  min_size_bytes: 256
  level: 6
  static_immutable_max_age: 31536000
  static_default_max_age: 3600

logging:
  verbose_result_truncate: 500

context:
  max_tokens: 128000
  warning_threshold_pct: 80
  critical_threshold_pct: 95

security:
  max_concurrent_sessions: 10
  idle_timeout_seconds: 300
  allowed_origins: []
  require_session_token: false

# Order resume after a transport drop (Wi-Fi blip, LB reset, heartbeat miss) on the
# cloud realtime path only -- local mode and Azure Speech mode never resume.
# An idle close (4000) is never resumable, and the idle clock
# (security.idle_timeout_seconds) keeps running while the guest is disconnected,
# so the hold is min(grace_seconds, remaining idle budget). See docs/order_resume.md.
resume:
  enabled: true
  grace_seconds: 120            # how long a dropped session's order is held
  max_detached: 20              # LRU cap on held sessions per worker
  history_turns: 6              # transcript turns replayed into the new upstream
  history_chars: 2000           # char cap on the replayed transcript
  nudge_after_seconds: 30       # silent-guest nudge after a resume; 0 disables
  first_frame_timeout_seconds: 2.0  # wait for extension.resume before starting fresh
  sweep_interval_seconds: 15    # how often idle/grace expiry is checked

resilience:
  # Rate-limit recovery on the cloud realtime path (see rate_limit.py). The demos
  # share one Azure OpenAI quota; a rate-limited response produces no output, so
  # without this the guest hears silence. Per failed response: retry silently after
  # the service's hint clamped to [0.5 s, 5 s] (else retry_delay_seconds); if that is
  # rate-limited too, the browser plays a pre-recorded apology clip and we retry after
  # the hint clamped to [2 s, 8 s] (else second_retry_delay_seconds); after
  # max_retries the browser asks the guest to say it again. Env override for enabled:
  # RATE_LIMIT_RECOVERY_ENABLED=true|false.
  rate_limit:
    enabled: true
    retry_delay_seconds: 1.5
    second_retry_delay_seconds: 4
    max_retries: 2

local_mode:
  enabled: false                          # Default: cloud mode
  model_path: "./models/phi4-mini/gpu/gpu-int4-rtn-block-32"  # Phi-4-mini-instruct ONNX model directory (must contain genai_config.json)
  offline_menu_path: ""                   # Override path to offline_menu.json (leave empty for auto-detect)
  tts_default_voice: "en_US-amy-medium"   # Default Piper voice model
  tts_length_scale: 0.7                   # Speech tempo (< 1.0 = faster / more upbeat)
  tts_available_voices:                   # Voices from huggingface.co/rhasspy/piper-voices
    - en_US-amy-medium
    - en_GB-jenny_dioco-medium
    - en_US-lessac-medium
    - en_US-kristin-medium
  tts_model_path: "./models/piper"        # Piper model directory
  stt_model: "base.en"                    # base.en (~150MB) — English-only model, faster+more accurate than base for food item names
  stt_device: "cpu"                       # Force CPU for Whisper — saves VRAM for Phi-4 (base.en on CPU is still fast ~200ms)
  stt_compute_type: "int8"                # CTranslate2 quantization (int8/float16/float32)
  device: "auto"                          # auto | cuda | cpu | directml
  max_length: 1024                        # Max total tokens (prompt + response) — reduced from 2048 to save KV cache VRAM
  temperature: 0.6                        # Generation temperature
  tts_sample_rate: 24000                  # Output sample rate (match frontend)
  lazy_load: true                         # Only load model on first use
