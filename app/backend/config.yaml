# Centralized configuration for McDonald's AI Drive-Thru backend.
# All magic numbers previously scattered across app.py, rtmt.py, tools.py, order_state.py
# are collected here. Changes take effect on next startup (or immediately in DEV_MODE).

model:
  temperature: 0.6
  max_response_output_tokens: 4096
  api_version: "2024-10-01-preview"
  default_voice: "coral"

vad:
  type: "server_vad"
  threshold: 0.5
  prefix_padding_ms: 300
  silence_duration_ms: 200

business_rules:
  tax_rate: 0.08
  max_item_quantity: 10
  max_order_items: 25
  happy_hour_start: 14
  happy_hour_end: 16
  happy_hour_discount: 0.5

cache:
  search_ttl_seconds: 60.0
  search_max_size: 128

audio:
  echo_cooldown_seconds: 1.5

search:
  k_nearest_neighbors: 15
  top_results: 3

connection:
  ws_heartbeat_seconds: 15.0
  ws_connect_timeout_total: 30
  ws_connect_timeout_connect: 10
  client_max_size_bytes: 4194304
  shutdown_timeout: 10.0
  keepalive_timeout: 75.0

compression:
  min_size_bytes: 256
  level: 6
  static_immutable_max_age: 31536000
  static_default_max_age: 3600

logging:
  verbose_result_truncate: 500

context:
  max_tokens: 128000
  warning_threshold_pct: 80
  critical_threshold_pct: 95

security:
  max_concurrent_sessions: 10
  idle_timeout_seconds: 300
  allowed_origins: []
  require_session_token: false

local_mode:
  enabled: false                          # Default: cloud mode
  model_path: "./models/phi4-multimodal/gpu/gpu-int4-rtn-block-32"  # Phi-4 ONNX model directory (must contain genai_config.json)
  offline_menu_path: ""                   # Override path to offline_menu.json (leave empty for auto-detect)
  tts_default_voice: "en_US-amy-medium"   # Default Piper voice model
  tts_length_scale: 0.7                   # Speech tempo (< 1.0 = faster / more upbeat)
  tts_available_voices:                   # Voices from huggingface.co/rhasspy/piper-voices
    - en_US-amy-medium
    - en_GB-jenny_dioco-medium
    - en_US-lessac-medium
    - en_US-kristin-medium
  tts_model_path: "./models/piper"        # Piper model directory
  stt_model: "tiny"                      # tiny | base | small | medium (tiny=~75MB, used as fallback only)
  stt_device: "auto"                      # auto | cuda | cpu (CUDA only)
  stt_compute_type: "int8"                # CTranslate2 quantization (int8/float16/float32)
  device: "auto"                          # auto | cuda | cpu | directml
  max_length: 1024                        # Max total tokens (prompt + response) — reduced from 2048 to save KV cache VRAM
  temperature: 0.6                        # Generation temperature
  tts_sample_rate: 24000                  # Output sample rate (match frontend)
  lazy_load: true                         # Only load model on first use
